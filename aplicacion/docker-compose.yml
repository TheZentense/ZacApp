services:
  zacapp-postgres:
    image: postgres:16-alpine
    container_name: zacapp-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Define POSTGRES_DB para PostgreSQL local}"
      POSTGRES_USER: "${POSTGRES_USER:?Define POSTGRES_USER para PostgreSQL local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD para PostgreSQL local}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zacapp_postgres_data:/var/lib/postgresql/data
      - ./database/local/init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations/202609090001_initial_schema.sql:/docker-entrypoint-initdb.d/10_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zacapp_postgres_data:
